name: Keep scheduled workflows active

on:
  workflow_dispatch:
  schedule:
    # Monthly repo activity prevents GitHub from disabling scheduled workflows for inactivity.
    - cron: "37 18 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update keepalive marker
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt

      - name: Commit keepalive marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "No keepalive change to commit."
          else
            git commit -m "Keep scheduled workflows active"
            git push
          fi
